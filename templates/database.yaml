AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - delivery photos | Nested stack: DATABASE.
  Multi-AZ RDS for PostgreSQL in the isolated data subnets. RDS generates, stores and
  rotates the master password in Secrets Manager; no credential appears in this repository.
  AWS Backup takes a daily backup and copies it to the recovery Region.

# -----------------------------------------------------------------------------
# Inputs
# -----------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Description: Short project prefix used in every resource name.
  Environment:
    Type: String
    Description: Deployment environment (dev, staging or prod).
  DataSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Isolated data subnets (two AZs) from the network stack.
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that admits PostgreSQL from the app tasks only.
  DbInstanceClass:
    Type: String
    Description: RDS instance class.
  DbEngineVersion:
    Type: String
    Description: PostgreSQL major version.
  DbAllocatedStorage:
    Type: Number
    Description: Initial storage in GiB (grows automatically up to 100 GiB).
  DbBackupRetentionDays:
    Type: Number
    Description: Days automated backups are kept (point-in-time restore window).
  DbBackupPlanRetentionDays:
    Type: Number
    Description: Days the daily AWS Backup recovery points are kept, in both Regions.
  DrRegion:
    Type: String
    Description: Recovery Region; its vault is created by the <project>-<env>-photos-dr stack.
  DbDeletionProtection:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Description: Blocks deletion of the instance while true.

Conditions:
  ProtectDatabase: !Equals
    - !Ref DbDeletionProtection
    - "true"

Resources:
  # ===========================================================================
  # PostgreSQL photo catalogue
  # ===========================================================================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated data subnets for the photo catalogue
      SubnetIds: !Ref DataSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-photos-db"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: photos
      MasterUsername: onward_app
      ManageMasterUserPassword: true          # RDS generates, stores and rotates it in Secrets Manager
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      PreferredBackupWindow: "01:00-02:00"
      PreferredMaintenanceWindow: "sun:02:30-sun:03:30"
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: !If
        - ProtectDatabase
        - true
        - false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-photos-db"

  # ===========================================================================
  # Daily AWS Backup with a copy in the recovery Region
  # ===========================================================================
  # The automated backups above give point-in-time restore for 7 days in this Region only.
  # This plan keeps daily recovery points longer and copies each one to the recovery Region,
  # so the catalogue survives the loss of eu-west-1. Vaults are retained: they hold evidence.
  BackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub "${ProjectName}-${Environment}-db-backups-${AWS::Region}"

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-db-backup-${AWS::Region}"
      Description: Lets AWS Backup back up and restore the photo catalogue database.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${ProjectName}-${Environment}-db-daily"
        BackupPlanRule:
          - RuleName: daily-with-copy-to-dr
            TargetBackupVault: !Ref BackupVault
            # 05:00 UTC: clear of the RDS backup window (01:00-02:00) and the Sunday
            # maintenance window (02:30-03:30); AWS Backup skips jobs that overlap them.
            ScheduleExpression: cron(0 5 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: !Ref DbBackupPlanRetentionDays
            CopyActions:
              - DestinationBackupVaultArn: !Sub "arn:${AWS::Partition}:backup:${DrRegion}:${AWS::AccountId}:backup-vault:${ProjectName}-${Environment}-db-backups-${DrRegion}"
                Lifecycle:
                  DeleteAfterDays: !Ref DbBackupPlanRetentionDays
            RecoveryPointTags:
              Project: !Ref ProjectName
              Environment: !Ref Environment

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: photos-db
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}"

# -----------------------------------------------------------------------------
# Outputs (consumed by the application stack)
# -----------------------------------------------------------------------------
Outputs:
  DatabaseEndpointAddress:
    Description: Private address; not reachable from the internet.
    Value: !GetAtt Database.Endpoint.Address
  DatabaseEndpointPort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: photos
  DatabaseSecretArn:
    Description: RDS-managed secret holding the master username and password.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  BackupVaultName:
    Description: Vault holding the daily recovery points in this Region.
    Value: !Ref BackupVault
  BackupPlanId:
    Value: !Ref BackupPlan
