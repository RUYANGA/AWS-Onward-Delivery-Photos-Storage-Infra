AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics delivery photos - release pipeline. An EventBridge rule starts
  CodePipeline when GitHub Actions pushes a new "latest" image to ECR. The pipeline hands
  the image, task definition and appspec to CodeDeploy, which performs a blue/green release
  with automatic rollback on alarm.

# =============================================================================
#  Release flow
#
#    app repo (GitHub Actions)  test -> build -> scan -> push :<git-sha>
#                               -> upload deploy/deploy-bundle.zip (taskdef.json + appspec.yaml)
#                               -> push :latest
#    EventBridge                ECR push of :latest starts the pipeline
#    CodePipeline   Source      ECR image (:latest) + deploy bundle (S3)
#                   Deploy      CodeDeploy blue/green: green tasks, test listener, traffic shift,
#                               rollback on alarm, blue kept KeepOldVersionMinutes
#
#  Imports exports from the bootstrap stack (ECR, deploy-bundle bucket) and from the
#  platform's application stack (cluster, service, listeners, target groups, alarms, roles),
#  so this stack is created after both.
# =============================================================================

Parameters:
  ProjectName:
    Type: String
    Default: onward
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev
  ReleaseImageTag:
    Type: String
    Default: latest
    Description: The ECR tag whose push starts a release.
  DeployBundleKey:
    Type: String
    Default: deploy/deploy-bundle.zip
  DeploymentConfig:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSAllAtOnce
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
    Description: Canary sends 10% of customers to the new version for 5 minutes first.
  KeepOldVersionMinutes:
    Type: Number
    Default: 15
    Description: How long the previous version stays running after a release, for one-click rollback.

Resources:
  # ------------------------------------------------------------ Artifact store
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------- CodeDeploy
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-codedeploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS"

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-${Environment}-photos-app"
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${ProjectName}-${Environment}-photos-dg"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: !Ref DeploymentConfig
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref KeepOldVersionMinutes
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-Target5xxAlarmName"
          - Name: !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-BlueUnhealthyAlarmName"
          - Name: !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-GreenUnhealthyAlarmName"
      ECSServices:
        - ClusterName: !ImportValue
            "Fn::Sub": "${ProjectName}-${Environment}-ClusterName"
          ServiceName: !ImportValue
            "Fn::Sub": "${ProjectName}-${Environment}-ServiceName"
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-BlueTargetGroupName"
              - Name: !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-GreenTargetGroupName"
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-ProductionListenerArn"
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-TestListenerArn"

  # -------------------------------------------------------------- CodePipeline
  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-pipeline"
      Description: What the release pipeline needs - and nothing more.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ArtifactStore
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"
          - Sid: ArtifactBucket
            Effect: Allow
            Action:
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !GetAtt ArtifactBucket.Arn
          - Sid: ReadDeployBundle
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub
              - "${BucketArn}/${DeployBundleKey}"
              - BucketArn: !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-DeployBundleBucketArn"
          - Sid: DeployBundleBucket
            Effect: Allow
            Action:
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-DeployBundleBucketArn"
          - Sid: ReadImage
            Effect: Allow
            Action:
              - ecr:DescribeImages
            Resource: !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-EcrRepositoryArn"
          - Sid: RunCodeDeploy
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:RegisterApplicationRevision
              - codedeploy:GetDeploymentConfig
            Resource: "*"
          - Sid: RegisterTaskDefinition
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:TagResource
            Resource: "*"
          - Sid: PassTaskRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !ImportValue
                "Fn::Sub": "${ProjectName}-${Environment}-TaskExecutionRoleArn"
              - !ImportValue
                "Fn::Sub": "${ProjectName}-${Environment}-TaskRoleArn"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-codepipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PipelinePolicy

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-photos-release"
      PipelineType: V2
      ExecutionMode: SUPERSEDED     # a newer release replaces one still waiting
      # Shown on each run (Executions > run > Variables). A release from ECR keeps the defaults;
      # a rollback sets the git SHA it redeploys and why.
      Variables:
        - Name: Version
          DefaultValue: latest
          Description: Git SHA of the release this run deploys (latest = the newest image)
        - Name: Reason
          DefaultValue: release
          Description: Why this run was started (release, or the reason given for a rollback)
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Image
              Namespace: ImageSource      # exposes #{ImageSource.ImageDigest} to later stages
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-EcrRepositoryName"
                ImageTag: !Ref ReleaseImageTag
              OutputArtifacts:
                - Name: ImageArtifact
              RunOrder: 1
            - Name: DeployBundle
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !ImportValue
                  "Fn::Sub": "${ProjectName}-${Environment}-DeployBundleBucketName"
                S3ObjectKey: !Ref DeployBundleKey
                PollForSourceChanges: "false"   # only the ECR event starts a release
              OutputArtifacts:
                - Name: DeployBundle
              RunOrder: 1
        - Name: Deploy
          # A failed release rolls this stage back to the last successful release (the same
          # image digest and deploy bundle), which also shows as a "Rollback" run in the console.
          OnFailure:
            Result: ROLLBACK
          Actions:
            - Name: BlueGreen
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - Name: DeployBundle
                - Name: ImageArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: DeployBundle
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: DeployBundle
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

  # ------------------------------------------------------------- EventBridge
  EventsStartPipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-events-start-pipeline"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - codepipeline:StartPipelineExecution
            Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-events-start-pipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsStartPipelinePolicy

  ImagePushedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-image-pushed"
      Description: Start a release when a new release image is pushed to ECR.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !ImportValue
              "Fn::Sub": "${ProjectName}-${Environment}-EcrRepositoryName"
          image-tag:
            - !Ref ReleaseImageTag
      Targets:
        - Id: release-pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt EventsRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Description: Watch releases here.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
