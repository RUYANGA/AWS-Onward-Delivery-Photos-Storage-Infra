name: validate-infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: cfn-lint and company standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install "cfn-lint>=1.20,<2" "pyyaml>=6"
      - name: cfn-lint (target Regions)
        run: cfn-lint --regions eu-west-1 eu-central-1 -- templates/*.yaml bootstrap/*.yaml
      - name: Company standards (no inline policies, users, keys or SSH; deployment files valid)
        run: bash scripts/check_standards.sh

  # Git sync deploys on merge, so the nested templates must already be in S3 by then.
  # Publishing from the pull request (content-addressed, write-once) guarantees that;
  # the run on main re-verifies the stored copies against the merged files.
  publish-nested-templates:
    name: publish nested templates
    needs: lint
    # Skipped until the bootstrap has created the CI role (AWS_ROLE_ARN = output InfraCiRoleArn).
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload nested templates to S3
        run: ./scripts/nested-templates.sh publish

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose
